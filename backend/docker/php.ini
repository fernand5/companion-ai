; Production overrides for the Laravel API container.
;
; max_execution_time is a ceiling, not the actual per-request limit — the app
; itself calls set_time_limit(200)/set_time_limit(300) for AI turns (see
; AiCoachService/WeeklyPlanCoachService), which can only raise the limit up to
; what PHP-FPM's own request_terminate_timeout (php-fpm-pool.conf) allows.
; This value just needs to be >= the highest set_time_limit() call in the app.
max_execution_time = 300
memory_limit = 256M

; APP_DEBUG=false already prevents Laravel from rendering stack traces (see
; config/app.php), but PHP's own display_errors is a second, independent
; layer — belt-and-suspenders so a PHP-level (not Laravel-level) fatal error
; can never leak a stack trace/file path to an API client.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Keep opcache on but validate timestamps — this app is deployed by rebuilding
; the image on every release (no live file edits in the running container), so
; correctness here costs nothing; disabling validation entirely is a
; micro-optimization not worth the risk of a stale-code footgun during rollout.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
