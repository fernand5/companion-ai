; PHP-FPM pool overrides for the Laravel API container.
[www]
user = www-data
group = www-data

; PHP-FPM clears its worker processes' environment by default (clear_env is
; effectively "yes" unless set otherwise) — without this, every env var
; Render injects into the container (DB_HOST, DB_CONNECTION, LOG_CHANNEL,
; AI_API_KEY, APP_KEY, ...) is invisible to the actual web-facing PHP
; process, even though it's plainly visible to `docker exec`/CLI commands in
; the same container. Confirmed by reproducing it locally: with this unset,
; every env() call in the app silently returned each config default instead
; (DB fell back to sqlite — "attempt to write a readonly database" — and
; logs silently went to storage/logs/laravel.log instead of LOG_CHANNEL=stderr),
; while a CLI `php artisan tinker` call in the same container worked fine,
; since CLI PHP isn't subject to FPM's env clearing.
clear_env = no

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data

; Sized for a 5-20 user beta on a small instance, not for scale — every AI
; request is synchronous (see the "no queue" deployment-readiness finding),
; so each worker is tied up for the duration of one chat/weekly-plan turn.
; Tune upward only if the instance's RAM budget grows.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; The hard FPM-level kill switch. This is NOT overridden by the app's own
; set_time_limit(300) calls (AiCoachService/WeeklyPlanCoachService) — that
; call raises PHP's own execution-time ceiling, but FPM independently kills
; the worker at this value regardless. Must stay >= the highest
; set_time_limit() in the app (currently 300s for the weekly-plan flow,
; which can loop up to ai.max_weekly_adaptation_iterations x ai.weekly_timeout
; ~= 270s worst case) with headroom, or FPM cuts the connection before the
; app's own graceful AiProviderException handling ever runs.
request_terminate_timeout = 310

; Emit a warning if a request runs unusually long, to make slow AI turns
; visible in logs without waiting for the hard timeout above.
request_slowlog_timeout = 60
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
